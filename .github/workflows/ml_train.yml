name: ML Training and GCR Deployment

on:
  push:
    branches: [ main ]
    paths:
      - 'Model-Pipeline/**'
      - 'Data-Pipeline/**'
      - 'data/raw/apify_unprocessed.csv'
      - 'requirements.txt'
  workflow_dispatch:
    inputs:
      test_llm:
        description: 'Test LLM response generation (adds 10-15 min)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCR_REGION: us-central1
  PYTHON_VERSION: '3.11'
  MIN_F1_SCORE: 0.60
  MAX_BIAS_VIOLATIONS: 10
  TEST_LLM: ${{ github.event.inputs.test_llm || 'false' }}

jobs:
  data-preprocessing:
    name: Data Preprocessing Pipeline
    runs-on: ubuntu-latest
    outputs:
      preprocessing-passed: ${{ steps.validate.outputs.passed }}
    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Download raw data from GCS
        run: |
          mkdir -p data/raw/
          
          echo "Downloading all CSV files from GCS..."
          gsutil -m cp 'gs://us-central1-echo-ai-9c58f7b7-bucket/data/raw/dataset_restaurant-review-aggregator_*.csv' data/raw/
          
          echo "Merging CSV files..."
          python -c "
          import pandas as pd
          from pathlib import Path
          
          # Find all downloaded CSVs
          csv_files = list(Path('data/raw').glob('dataset_restaurant*.csv'))
          print(f'Found {len(csv_files)} CSV files')
          
          # Load and merge all
          dfs = []
          for idx, file in enumerate(csv_files, 1):
              df = pd.read_csv(file)
              print(f'Dataset {idx} ({file.name}): {len(df)} reviews')
              dfs.append(df)
          
          # Merge all datasets
          df_merged = pd.concat(dfs, ignore_index=True)
          
          # Remove duplicates
          before_dedup = len(df_merged)
          df_merged = df_merged.drop_duplicates(subset=['reviewText'], keep='first')
          after_dedup = len(df_merged)
          
          print(f'Total merged: {before_dedup} reviews')
          print(f'After deduplication: {after_dedup} reviews')
          print(f'Duplicates removed: {before_dedup - after_dedup}')
          
          # Save merged file
          df_merged.to_csv('data/raw/apify_unprocessed.csv', index=False)
          print('Saved to data/raw/apify_unprocessed.csv')
          "
          
          echo "✓ Data merge complete!"
          ls -lh data/raw/apify_unprocessed.csv
      
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt
      
      - name: Run preprocessing
        run: |
          cd Data-Pipeline/scripts
          python preprocessing.py
      
      - name: Run feature engineering
        run: |
          cd Data-Pipeline/scripts
          python feature_engineering.py
      
      - name: Run data validation
        id: validate
        run: |
          cd Data-Pipeline/scripts
          python validation.py
          
          if [ -f "data/metrics/validation_results.json" ]; then
            PASSED=$(python -c "import json; data=json.load(open('data/metrics/validation_results.json')); print(data.get('validation_passed', False))")
            echo "passed=$PASSED" >> $GITHUB_OUTPUT
            
            if [ "$PASSED" = "False" ]; then
              echo "[ERROR] Data validation failed"
              exit 1
            fi
          fi
      
      - name: Upload processed data
        uses: actions/upload-artifact@v4
        with:
          name: processed-data
          path: data/

  model-training:
    name: Train ML Model
    runs-on: ubuntu-latest
    needs: data-preprocessing
    if: needs.data-preprocessing.outputs.preprocessing-passed == 'true'
    
    outputs:
      model-trained: ${{ steps.training.outputs.success }}
      best-model: ${{ steps.training.outputs.model_name }}
      f1-score: ${{ steps.training.outputs.f1_score }}
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          pip install --no-cache-dir -r requirements.txt
      
      - name: Download processed data
        uses: actions/download-artifact@v4
        with:
          name: processed-data
          path: data/
      
      - name: Disable MLflow tracking
        run: |
          echo "export MLFLOW_TRACKING_URI=''" >> $GITHUB_ENV
      
      - name: Train models
        id: training
        run: |
          cd Model-Pipeline
          python run_ml_pipeline.py --quick
          
          if [ -f "results/training_results.json" ]; then
            BEST_MODEL=$(python -c "import json; data=json.load(open('results/training_results.json')); print(data.get('best_model', 'Unknown'))")
            BEST_SCORE=$(python -c "import json; data=json.load(open('results/training_results.json')); print(data.get('best_f1_score', 0))")
            
            echo "success=true" >> $GITHUB_OUTPUT
            echo "model_name=$BEST_MODEL" >> $GITHUB_OUTPUT
            echo "f1_score=$BEST_SCORE" >> $GITHUB_OUTPUT
            
            echo "[OK] Training: $BEST_MODEL F1=$BEST_SCORE"
          else
            echo "success=false" >> $GITHUB_OUTPUT
            exit 1
          fi
      
      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trained-models
          path: |
            Model-Pipeline/models/
            Model-Pipeline/results/

  model-validation:
    name: Validate Model Performance
    runs-on: ubuntu-latest
    needs: model-training
    if: needs.model-training.outputs.model-trained == 'true'
    
    outputs:
      validation-passed: ${{ steps.validate.outputs.passed }}
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt
      
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: trained-models
          path: Model-Pipeline/
      
      - name: Download data
        uses: actions/download-artifact@v4
        with:
          name: processed-data
          path: data/
      
      - name: Validate model
        id: validate
        timeout-minutes: 15
        run: |
          cd Model-Pipeline
          timeout 600 python model_validation.py || echo "[WARNING] Validation timeout"
          
          F1_SCORE=${{ needs.model-training.outputs.f1-score }}
          echo "[INFO] Model F1 Score: $F1_SCORE"
          
          PASS=$(python -c "print($F1_SCORE >= $MIN_F1_SCORE)")
          if [ "$PASS" = "True" ]; then
            echo "passed=true" >> $GITHUB_OUTPUT
            echo "[OK] Validation passed: F1=$F1_SCORE (min: $MIN_F1_SCORE)"
          else
            echo "passed=false" >> $GITHUB_OUTPUT
            echo "[ERROR] F1=$F1_SCORE below threshold $MIN_F1_SCORE"
            exit 1
          fi

  inference-and-response-generation:
    name: Run Inference & Generate Responses
    runs-on: ubuntu-latest
    needs: model-validation
    if: needs.model-validation.outputs.validation-passed == 'true'
    
    outputs:
      inference-completed: ${{ steps.inference.outputs.completed }}
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          pip install --no-cache-dir -r requirements.txt
      
      - name: Download trained models
        uses: actions/download-artifact@v4
        with:
          name: trained-models
          path: Model-Pipeline/
      
      - name: Download processed data
        uses: actions/download-artifact@v4
        with:
          name: processed-data
          path: data/
      
      - name: Run inference pipeline (sentiment only)
        id: inference
        timeout-minutes: 20
        run: |
          cd Model-Pipeline
          
          # Find the actual features file
          FEATURES_FILE=$(find ../data -name "*features*.csv" -o -name "*processed*.csv" | head -1)
          
          if [ -z "$FEATURES_FILE" ]; then
            echo "[ERROR] No features file found in data directory"
            ls -la ../data/processed/ || echo "No processed directory"
            ls -la ../data/raw/ || echo "No raw directory"
            exit 1
          fi
          
          echo "[INFO] Using features file: $FEATURES_FILE"
          
          # Run inference without LLM (template-based responses)
          python -c "
          from inference_pipeline import EchoAIInference
          import pandas as pd
          from pathlib import Path
          import sys
          
          features_file = '$FEATURES_FILE'
          print(f'[INFO] Loading test data from {features_file}...')
          
          try:
              df = pd.read_csv(features_file).head(100)
              print(f'[INFO] Loaded {len(df)} reviews')
              print(f'[INFO] Columns: {list(df.columns)}')
          except Exception as e:
              print(f'[ERROR] Failed to load data: {e}')
              sys.exit(1)
          
          print('[INFO] Initializing inference pipeline...')
          pipeline = EchoAIInference()
          pipeline.load_models(load_llm=False)  # Skip LLM in CI/CD
          
          print('[INFO] Running inference and generating template responses...')
          df_results = pipeline.process_dataframe(
              df, 
              generate_responses=True,
              save_results=False
          )
          
          # Save results
          output_file = Path('results/inference_results.csv')
          output_file.parent.mkdir(exist_ok=True)
          df_results.to_csv(output_file, index=False)
          
          print(f'[OK] Inference completed: {len(df_results)} reviews processed')
          print(f'[OK] Results saved to {output_file}')
          
          # Print sentiment distribution
          sentiment_dist = df_results['sentiment'].value_counts()
          print('[INFO] Sentiment Distribution:')
          for sentiment, count in sentiment_dist.items():
              print(f'  {sentiment}: {count}')
          
          # Check if responses were generated
          if 'generated_response' in df_results.columns:
              responses_generated = df_results['generated_response'].notna().sum()
              print(f'[OK] Responses generated: {responses_generated}/{len(df_results)}')
          " 
          
          if [ $? -eq 0 ]; then
            echo "completed=true" >> $GITHUB_OUTPUT
          else
            echo "completed=false" >> $GITHUB_OUTPUT
            exit 1
          fi
      
      - name: Upload inference results
        uses: actions/upload-artifact@v4
        with:
          name: inference-results
          path: |
            Model-Pipeline/results/inference_results.csv

  llm-response-testing:
    name: LLM Response Quality Testing
    runs-on: ubuntu-latest
    needs: inference-and-response-generation
    if: |
      needs.inference-and-response-generation.outputs.inference-completed == 'true' &&
      github.event.inputs.test_llm == 'true'
    
    outputs:
      llm-tested: ${{ steps.llm_test.outputs.tested }}
      avg-quality-score: ${{ steps.llm_test.outputs.quality_score }}
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies including transformers
        run: |
          pip install --no-cache-dir -r requirements.txt
          pip install transformers==4.36.0 torch==2.1.0 accelerate==0.25.0
          pip install sentencepiece protobuf
      
      - name: Download trained models
        uses: actions/download-artifact@v4
        with:
          name: trained-models
          path: Model-Pipeline/
      
      - name: Download processed data
        uses: actions/download-artifact@v4
        with:
          name: processed-data
          path: data/
      
      - name: Download template-based inference results
        uses: actions/download-artifact@v4
        with:
          name: inference-results
          path: Model-Pipeline/results/template_results/
      
      - name: Test LLM response generation
        id: llm_test
        timeout-minutes: 30
        run: |
          cd Model-Pipeline
          
          # Find features file
          FEATURES_FILE=$(find ../data -name "*features*.csv" -o -name "*processed*.csv" | head -1)
          
          python -c "
          from inference_pipeline import EchoAIInference
          import pandas as pd
          from pathlib import Path
          import json
          import time
          
          print('[INFO] Starting LLM Response Testing...')
          print('[INFO] This will take 10-15 minutes due to model download')
          
          # Load test data (smaller sample for LLM testing)
          features_file = '$FEATURES_FILE'
          df = pd.read_csv(features_file).head(20)
          print(f'[INFO] Testing on {len(df)} reviews')
          
          # Test with Flan-T5-Base (lightweight LLM)
          print('[INFO] Initializing LLM pipeline with Flan-T5-Base...')
          start_time = time.time()
          
          try:
              pipeline = EchoAIInference(llm_model='google/flan-t5-base')
              pipeline.load_models(load_llm=True)
              print(f'[OK] LLM loaded in {time.time() - start_time:.1f}s')
              
              # Generate LLM-based responses
              print('[INFO] Generating LLM responses...')
              gen_start = time.time()
              df_llm = pipeline.process_dataframe(
                  df,
                  generate_responses=True,
                  save_results=False
              )
              print(f'[OK] Generated {len(df_llm)} LLM responses in {time.time() - gen_start:.1f}s')
              
              # Save LLM results
              output_file = Path('results/llm_inference_results.csv')
              output_file.parent.mkdir(exist_ok=True, parents=True)
              df_llm.to_csv(output_file, index=False)
              
              # Load template results for comparison
              template_file = Path('results/template_results/inference_results.csv')
              df_template = pd.read_csv(template_file).head(20)
              
              # Compare response quality
              comparison = {
                  'llm_model': 'google/flan-t5-base',
                  'samples_tested': len(df_llm),
                  'llm_responses': [],
                  'template_responses': [],
                  'reviews': [],
                  'sentiments': [],
                  'metrics': {
                      'avg_llm_length': 0,
                      'avg_template_length': 0,
                      'generation_time_per_review': (time.time() - gen_start) / len(df_llm)
                  }
              }
              
              # Collect samples for analysis
              for idx in range(min(5, len(df_llm))):
                  comparison['reviews'].append(df_llm.iloc[idx].get('reviewText', ''))
                  comparison['sentiments'].append(df_llm.iloc[idx].get('sentiment', ''))
                  comparison['llm_responses'].append(df_llm.iloc[idx].get('generated_response', ''))
                  comparison['template_responses'].append(df_template.iloc[idx].get('generated_response', ''))
              
              # Calculate metrics
              llm_lengths = df_llm['generated_response'].str.len()
              template_lengths = df_template['generated_response'].str.len()
              
              comparison['metrics']['avg_llm_length'] = float(llm_lengths.mean())
              comparison['metrics']['avg_template_length'] = float(template_lengths.mean())
              comparison['metrics']['llm_longer_by'] = float(llm_lengths.mean() - template_lengths.mean())
              
              # Simple quality heuristics
              quality_score = 0
              if comparison['metrics']['avg_llm_length'] > 50:
                  quality_score += 2
              if comparison['metrics']['avg_llm_length'] > 100:
                  quality_score += 2
              if comparison['metrics']['generation_time_per_review'] < 5:
                  quality_score += 3
              
              # Check for variation (LLMs should be more varied than templates)
              unique_llm = df_llm['generated_response'].nunique()
              unique_template = df_template['generated_response'].nunique()
              if unique_llm > unique_template:
                  quality_score += 3
                  comparison['metrics']['more_varied'] = True
              else:
                  comparison['metrics']['more_varied'] = False
              
              comparison['metrics']['quality_score'] = quality_score
              comparison['metrics']['quality_rating'] = 'Excellent' if quality_score >= 8 else 'Good' if quality_score >= 5 else 'Acceptable'
              
              # Save comparison report
              report_file = Path('results/llm_comparison_report.json')
              with open(report_file, 'w') as f:
                  json.dump(comparison, f, indent=2)
              
              print(f'[OK] LLM Testing Complete')
              print(f'[INFO] Quality Score: {quality_score}/10 ({comparison[\"metrics\"][\"quality_rating\"]})')
              print(f'[INFO] Avg LLM Response Length: {comparison[\"metrics\"][\"avg_llm_length\"]:.0f} chars')
              print(f'[INFO] Avg Template Response Length: {comparison[\"metrics\"][\"avg_template_length\"]:.0f} chars')
              print(f'[INFO] More Varied: {comparison[\"metrics\"][\"more_varied\"]}')
              print(f'[INFO] Time per review: {comparison[\"metrics\"][\"generation_time_per_review\"]:.2f}s')
              
              # Output for GitHub Actions
              with open('/tmp/llm_outputs.txt', 'w') as f:
                  f.write(f'tested=true\n')
                  f.write(f'quality_score={quality_score}\n')
              
          except Exception as e:
              print(f'[ERROR] LLM testing failed: {e}')
              import traceback
              traceback.print_exc()
              
              with open('/tmp/llm_outputs.txt', 'w') as f:
                  f.write(f'tested=false\n')
                  f.write(f'quality_score=0\n')
          "
          
          # Read outputs
          if [ -f /tmp/llm_outputs.txt ]; then
            while IFS='=' read -r key value; do
              echo "$key=$value" >> $GITHUB_OUTPUT
            done < /tmp/llm_outputs.txt
          else
            echo "tested=false" >> $GITHUB_OUTPUT
            echo "quality_score=0" >> $GITHUB_OUTPUT
          fi
      
      - name: Upload LLM results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm-results
          path: |
            Model-Pipeline/results/llm_inference_results.csv
            Model-Pipeline/results/llm_comparison_report.json

  bias-detection:
    name: Bias and Fairness Check
    runs-on: ubuntu-latest
    needs: model-validation
    if: needs.model-validation.outputs.validation-passed == 'true'
    
    outputs:
      bias-passed: ${{ steps.bias.outputs.passed }}
      violations: ${{ steps.bias.outputs.violations }}
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt
      
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: trained-models
          path: Model-Pipeline/
      
      - name: Download data
        uses: actions/download-artifact@v4
        with:
          name: processed-data
          path: data/
      
      - name: Run bias detection
        id: bias
        timeout-minutes: 10
        run: |
          cd Model-Pipeline
          timeout 300 python bias_detection.py || echo "[WARNING] Timeout"
          
          if [ -f "results/bias_report.json" ]; then
            VIOLATIONS=$(python -c "import json; data=json.load(open('results/bias_report.json')); print(len(data.get('violations', [])))")
            echo "violations=$VIOLATIONS" >> $GITHUB_OUTPUT
            
            if [ $VIOLATIONS -le $MAX_BIAS_VIOLATIONS ]; then
              echo "passed=true" >> $GITHUB_OUTPUT
              echo "[OK] Bias check passed: $VIOLATIONS violations"
            else
              echo "passed=true" >> $GITHUB_OUTPUT
              echo "[WARNING] $VIOLATIONS violations (continuing anyway)"
            fi
          else
            echo "passed=true" >> $GITHUB_OUTPUT
            echo "[WARNING] No bias report generated"
          fi

  push-to-gcr:
    name: Push Model to GCR
    runs-on: ubuntu-latest
    needs: [model-training, model-validation, bias-detection, inference-and-response-generation]
    if: |
      needs.model-validation.outputs.validation-passed == 'true' &&
      github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      
      - name: Configure Docker for GCR
        run: |
          gcloud auth configure-docker ${{ env.GCR_REGION }}-docker.pkg.dev
      
      - name: Download trained models
        uses: actions/download-artifact@v4
        with:
          name: trained-models
          path: Model-Pipeline/
      
      - name: Download inference results
        uses: actions/download-artifact@v4
        with:
          name: inference-results
          path: Model-Pipeline/results/
      
      - name: Download LLM results (if available)
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: llm-results
          path: Model-Pipeline/results/llm/
      
      - name: Create model package
        run: |
          cd Model-Pipeline/models
          mkdir -p model-package
          cp best_model.pkl model-package/
          cp tfidf_vectorizer.pkl model-package/
          
          # Create metadata file
          cat > model-package/model_metadata.json << EOF
          {
            "model_name": "${{ needs.model-training.outputs.best-model }}",
            "f1_score": ${{ needs.model-training.outputs.f1-score }},
            "trained_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "git_commit": "${{ github.sha }}",
            "git_branch": "${{ github.ref_name }}",
            "inference_completed": "${{ needs.inference-and-response-generation.outputs.inference-completed }}",
            "bias_violations": ${{ needs.bias-detection.outputs.violations }}
          }
          EOF
          
          tar -czf echoai-model-${{ github.sha }}.tar.gz model-package/
          echo "[OK] Model packaged"
      
      - name: Upload to GCS for model registry
        run: |
          VERSION=$(date +%Y%m%d-%H%M%S)
          BUCKET="gs://${{ env.PROJECT_ID }}-models"
          
          # Create bucket if doesn't exist
          gsutil mb -l ${{ env.GCR_REGION }} $BUCKET || echo "Bucket exists"
          
          # Upload model package
          gsutil cp Model-Pipeline/models/echoai-model-${{ github.sha }}.tar.gz \
            $BUCKET/echoai-sentiment-model/$VERSION/model.tar.gz
          
          # Upload metadata
          gsutil cp Model-Pipeline/models/model-package/model_metadata.json \
            $BUCKET/echoai-sentiment-model/$VERSION/metadata.json
          
          # Upload inference results
          gsutil cp Model-Pipeline/results/inference_results.csv \
            $BUCKET/echoai-sentiment-model/$VERSION/inference_results.csv
          
          # Upload LLM results if available
          if [ -f "Model-Pipeline/results/llm/llm_inference_results.csv" ]; then
            gsutil cp Model-Pipeline/results/llm/llm_inference_results.csv \
              $BUCKET/echoai-sentiment-model/$VERSION/llm_inference_results.csv
            gsutil cp Model-Pipeline/results/llm/llm_comparison_report.json \
              $BUCKET/echoai-sentiment-model/$VERSION/llm_comparison_report.json
            echo "[OK] LLM results uploaded"
          fi
          
          # Tag as latest
          echo "$VERSION" | gsutil cp - $BUCKET/echoai-sentiment-model/latest.txt
          
          echo "[OK] Model uploaded to GCS: $BUCKET/echoai-sentiment-model/$VERSION/"
          echo "MODEL_VERSION=$VERSION" >> $GITHUB_ENV
      
      - name: Create model registry entry
        run: |
          echo "Model Registry Entry Created:"
          echo "  Project: ${{ env.PROJECT_ID }}"
          echo "  Model: echoai-sentiment-model"
          echo "  Version: ${{ env.MODEL_VERSION }}"
          echo "  Location: gs://${{ env.PROJECT_ID }}-models/echoai-sentiment-model/${{ env.MODEL_VERSION }}/"
          echo "  F1 Score: ${{ needs.model-training.outputs.f1-score }}"
          echo "  Bias Violations: ${{ needs.bias-detection.outputs.violations }}"
          echo "  Inference Completed: ${{ needs.inference-and-response-generation.outputs.inference-completed }}"
          echo "  Commit: ${{ github.sha }}"

  notify:
    name: Send Notifications
    runs-on: ubuntu-latest
    needs: [data-preprocessing, model-training, model-validation, inference-and-response-generation, llm-response-testing, bias-detection, push-to-gcr]
    if: always()
    
    steps:
      - name: Create summary
        run: |
          echo "## EchoAI ML Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Model Performance" >> $GITHUB_STEP_SUMMARY
          echo "- Best Model: ${{ needs.model-training.outputs.best-model }}" >> $GITHUB_STEP_SUMMARY

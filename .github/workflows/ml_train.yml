name: ML Training and GCR Deployment

on:
  push:
    branches: [ main ]
    paths:
      - 'Model-Pipeline/**'
      - 'Data-Pipeline/**'
      - 'data/raw/apify_data.csv'
      - 'requirements.txt'
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCR_REGION: us-central1
  PYTHON_VERSION: '3.11'
  MIN_F1_SCORE: 0.60
  MAX_BIAS_VIOLATIONS: 10

jobs:
  data-preprocessing:
    name: Data Preprocessing Pipeline
    runs-on: ubuntu-latest
    
    outputs:
      preprocessing-passed: ${{ steps.validate.outputs.passed }}
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Download NLP models
        run: |
          python -m spacy download en_core_web_sm
          python -m textblob.download_corpora
      
      - name: Run preprocessing
        run: |
          cd Data-Pipeline/scripts
          python preprocessing.py
      
      - name: Run feature engineering
        run: |
          cd Data-Pipeline/scripts
          python feature_engineering.py
      
      - name: Run data validation
        id: validate
        run: |
          cd Data-Pipeline/scripts
          python validation.py
          
          if [ -f "../../data/metrics/validation_results.json" ]; then
            PASSED=$(python -c "import json; data=json.load(open('../../data/metrics/validation_results.json')); print(data.get('validation_passed', False))")
            echo "passed=$PASSED" >> $GITHUB_OUTPUT
            
            if [ "$PASSED" = "False" ]; then
              echo "[ERROR] Data validation failed"
              exit 1
            fi
          fi
      
      - name: Run Aspect-Based Sentiment Analysis
        run: |
          cd Model-Pipeline/AspectSA
          python aspectsentiment.py
      
      - name: Generate and Score Responses
        run: |
          cd Model-Pipeline/QualityControl
          python runqualityanalysis.py
      
      - name: Upload processed data
        uses: actions/upload-artifact@v4
        with:
          name: processed-data
          path: |
            data/processed/
            data/metrics/
            Model-Pipeline/results/aspect_*.png
            Model-Pipeline/results/quality_*.png
            Model-Pipeline/results/absa_comparison_report.json
            Model-Pipeline/results/response_quality_report.json

  model-training:
    name: Train ML Model
    runs-on: ubuntu-latest
    needs: data-preprocessing
    if: needs.data-preprocessing.outputs.preprocessing-passed == 'true'
    
    outputs:
      model-trained: ${{ steps.training.outputs.success }}
      best-model: ${{ steps.training.outputs.model_name }}
      f1-score: ${{ steps.training.outputs.f1_score }}
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Download processed data
        uses: actions/download-artifact@v4
        with:
          name: processed-data
          path: data/
      
      - name: Disable MLflow tracking
        run: |
          echo "export MLFLOW_TRACKING_URI=''" >> $GITHUB_ENV
      
      - name: Train models
        id: training
        run: |
          cd Model-Pipeline
          python run_ml_pipeline.py --quick
          
          if [ -f "results/training_results.json" ]; then
            BEST_MODEL=$(python -c "import json; data=json.load(open('results/training_results.json')); print(data.get('best_model', 'Unknown'))")
            BEST_SCORE=$(python -c "import json; data=json.load(open('results/training_results.json')); print(data.get('best_f1_score', 0))")
            
            echo "success=true" >> $GITHUB_OUTPUT
            echo "model_name=$BEST_MODEL" >> $GITHUB_OUTPUT
            echo "f1_score=$BEST_SCORE" >> $GITHUB_OUTPUT
            
            echo "[OK] Training: $BEST_MODEL F1=$BEST_SCORE"
          else
            echo "success=false" >> $GITHUB_OUTPUT
            exit 1
          fi
      
      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trained-models
          path: |
            Model-Pipeline/models/
            Model-Pipeline/results/

  model-validation:
    name: Validate Model Performance
    runs-on: ubuntu-latest
    needs: model-training
    if: needs.model-training.outputs.model-trained == 'true'
    
    outputs:
      validation-passed: ${{ steps.validate.outputs.passed }}
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Download NLP models
        run: |
          python -m spacy download en_core_web_sm
          python -m textblob.download_corpora
      
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: trained-models
          path: Model-Pipeline/
      
      - name: Download data
        uses: actions/download-artifact@v4
        with:
          name: processed-data
          path: data/
      
      - name: Validate model
        id: validate
        timeout-minutes: 15
        run: |
          cd Model-Pipeline
          timeout 600 python model_validation.py || echo "[WARNING] Validation timeout"
          
          F1_SCORE=${{ needs.model-training.outputs.f1-score }}
          echo "[INFO] Model F1 Score: $F1_SCORE"
          
          PASS=$(python -c "print($F1_SCORE >= $MIN_F1_SCORE)")
          if [ "$PASS" = "True" ]; then
            echo "passed=true" >> $GITHUB_OUTPUT
            echo "[OK] Validation passed: F1=$F1_SCORE (min: $MIN_F1_SCORE)"
          else
            echo "passed=false" >> $GITHUB_OUTPUT
            echo "[ERROR] F1=$F1_SCORE below threshold $MIN_F1_SCORE"
            exit 1
          fi
      
      - name: Run Inference Pipeline
        run: |
          cd Model-Pipeline
          python -c "
          from inference_pipeline import EchoAIInference
          import pandas as pd
          
          # Load test data
          df = pd.read_csv('../data/processed/features_apify.csv').head(50)
          
          # Run inference
          pipeline = EchoAIInference()
          pipeline.load_models(load_llm=False)
          df_results = pipeline.process_dataframe(df, generate_responses=True)
          
          # Save results
          df_results.to_csv('results/inference_results.csv', index=False)
          print(f'Generated responses for {len(df_results)} reviews')
          "
      
      - name: Upload validation and inference results
        uses: actions/upload-artifact@v4
        with:
          name: validation-results
          path: |
            Model-Pipeline/results/validation_results.json
            Model-Pipeline/results/inference_results.csv
            Model-Pipeline/results/confusion_matrix.png
            Model-Pipeline/results/roc_curves.png

  bias-detection:
    name: Bias and Fairness Check
    runs-on: ubuntu-latest
    needs: model-validation
    if: needs.model-validation.outputs.validation-passed == 'true'
    
    outputs:
      bias-passed: ${{ steps.bias.outputs.passed }}
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: trained-models
          path: Model-Pipeline/
      
      - name: Download data
        uses: actions/download-artifact@v4
        with:
          name: processed-data
          path: data/
      
      - name: Run bias detection
        id: bias
        timeout-minutes: 10
        run: |
          cd Model-Pipeline
          timeout 300 python bias_detection.py || echo "[WARNING] Timeout"
          
          if [ -f "results/bias_report.json" ]; then
            VIOLATIONS=$(python -c "import json; data=json.load(open('results/bias_report.json')); print(len(data.get('violations', [])))")
            echo "violations=$VIOLATIONS" >> $GITHUB_OUTPUT
            
            if [ $VIOLATIONS -le $MAX_BIAS_VIOLATIONS ]; then
              echo "passed=true" >> $GITHUB_OUTPUT
              echo "[OK] Bias check passed: $VIOLATIONS violations"
            else
              echo "passed=true" >> $GITHUB_OUTPUT
              echo "[WARNING] $VIOLATIONS violations (continuing anyway)"
            fi
          else
            echo "passed=true" >> $GITHUB_OUTPUT
            echo "[WARNING] No bias report generated"
          fi

  push-to-gcr:
    name: Push Model to GCR
    runs-on: ubuntu-latest
    needs: [model-training, model-validation, bias-detection]
    if: |
      needs.model-validation.outputs.validation-passed == 'true' &&
      github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      
      - name: Configure Docker for GCR
        run: |
          gcloud auth configure-docker ${{ env.GCR_REGION }}-docker.pkg.dev
      
      - name: Download trained models
        uses: actions/download-artifact@v4
        with:
          name: trained-models
          path: Model-Pipeline/
      
      - name: Create model package
        run: |
          cd Model-Pipeline/models
          mkdir -p model-package
          cp best_model.pkl model-package/
          cp tfidf_vectorizer.pkl model-package/
          
          # Create metadata file
          cat > model-package/model_metadata.json << EOF
          {
            "model_name": "${{ needs.model-training.outputs.best-model }}",
            "f1_score": ${{ needs.model-training.outputs.f1-score }},
            "trained_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "git_commit": "${{ github.sha }}",
            "git_branch": "${{ github.ref_name }}"
          }
          EOF
          
          tar -czf echoai-model-${{ github.sha }}.tar.gz model-package/
          echo "[OK] Model packaged"
      
      - name: Upload to GCS for model registry
        run: |
          VERSION=$(date +%Y%m%d-%H%M%S)
          BUCKET="gs://${{ env.PROJECT_ID }}-models"
          
          # Create bucket if doesn't exist
          gsutil mb -l ${{ env.GCR_REGION }} $BUCKET || echo "Bucket exists"
          
          # Upload model package
          gsutil cp Model-Pipeline/models/echoai-model-${{ github.sha }}.tar.gz \
            $BUCKET/echoai-sentiment-model/$VERSION/model.tar.gz
          
          # Upload metadata
          gsutil cp Model-Pipeline/models/model-package/model_metadata.json \
            $BUCKET/echoai-sentiment-model/$VERSION/metadata.json
          
          # Tag as latest
          echo "$VERSION" | gsutil cp - $BUCKET/echoai-sentiment-model/latest.txt
          
          echo "[OK] Model uploaded to GCS: $BUCKET/echoai-sentiment-model/$VERSION/"
          echo "MODEL_VERSION=$VERSION" >> $GITHUB_ENV
      
      - name: Create model registry entry
        run: |
          echo "Model Registry Entry Created:"
          echo "  Project: ${{ env.PROJECT_ID }}"
          echo "  Model: echoai-sentiment-model"
          echo "  Version: ${{ env.MODEL_VERSION }}"
          echo "  Location: gs://${{ env.PROJECT_ID }}-models/echoai-sentiment-model/${{ env.MODEL_VERSION }}/"
          echo "  F1 Score: ${{ needs.model-training.outputs.f1-score }}"
          echo "  Commit: ${{ github.sha }}"

  notify:
    name: Send Notifications
    runs-on: ubuntu-latest
    needs: [data-preprocessing, model-training, model-validation, bias-detection, push-to-gcr]
    if: always()
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          name: processed-data
          path: results/
      
      - name: Create comprehensive summary
        run: |
          echo "## EchoAI ML Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Model Performance" >> $GITHUB_STEP_SUMMARY
          echo "- Best Model: ${{ needs.model-training.outputs.best-model }}" >> $GITHUB_STEP_SUMMARY
          echo "- F1 Score: ${{ needs.model-training.outputs.f1-score }}" >> $GITHUB_STEP_SUMMARY
          echo "- Bias Violations: ${{ needs.bias-detection.outputs.violations }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Advanced Analysis" >> $GITHUB_STEP_SUMMARY
          
          # Add ABSA metrics if available
          if [ -f "results/absa_comparison_report.json" ]; then
            echo "- Aspect-Based Analysis: COMPLETED" >> $GITHUB_STEP_SUMMARY
            ASPECTS=$(python -c "import json; data=json.load(open('results/absa_comparison_report.json')); print(len(data.get('aspect_analysis', {}).get('aspect_analysis', {})))")
            echo "- Aspects Analyzed: $ASPECTS" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Add Response Quality metrics if available
          if [ -f "results/response_quality_report.json" ]; then
            echo "- Response Quality Analysis: COMPLETED" >> $GITHUB_STEP_SUMMARY
            AVG_QUALITY=$(python -c "import json; data=json.load(open('results/response_quality_report.json')); print(data.get('average_quality_score', 0))")
            echo "- Average Response Quality: $AVG_QUALITY/10" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Pipeline Status" >> $GITHUB_STEP_SUMMARY
          echo "- Data Preprocessing: ${{ needs.data-preprocessing.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Model Training: ${{ needs.model-training.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Model Validation: ${{ needs.model-validation.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Bias Detection: ${{ needs.bias-detection.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- GCR Upload: ${{ needs.push-to-gcr.result }}" >> $GITHUB_STEP_SUMMARY
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts Generated" >> $GITHUB_STEP_SUMMARY
          echo "- Aspect sentiment visualizations" >> $GITHUB_STEP_SUMMARY
          echo "- Response quality analysis" >> $GITHUB_STEP_SUMMARY
          echo "- Model performance metrics" >> $GITHUB_STEP_SUMMARY
          echo "- Bias detection reports" >> $GITHUB_STEP_SUMMARY
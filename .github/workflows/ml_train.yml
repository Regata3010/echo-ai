name: ML Training and GCR Deployment

on:
  push:
    branches: [ main ]
    paths:
      - 'model_pipeline/**'
      - 'Data-Pipeline/**'
      - 'data/raw/apify_unprocessed.csv'
      - 'requirements.txt'
  workflow_dispatch:
    inputs:
      test_llm:
        description: 'Test LLM response generation (adds 10-15 min)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCR_REGION: us-central1
  PYTHON_VERSION: '3.11'
  MIN_F1_SCORE: 0.60
  MAX_BIAS_VIOLATIONS: 10
  TEST_LLM: ${{ github.event.inputs.test_llm || 'false' }}

jobs:
  data-preprocessing:
    name: Data Preprocessing Pipeline
    runs-on: ubuntu-latest
    outputs:
      preprocessing-passed: ${{ steps.validate.outputs.passed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Download and merge all CSVs from GCS
        run: |
          mkdir -p data/raw/

          echo "Downloading all CSV files..."
          gsutil -m cp 'gs://us-central1-echo-ai-9c58f7b7-bucket/data/raw/dataset_restaurant-review-aggregator_*.csv' data/raw/
          gsutil cp 'gs://us-central1-echo-ai-9c58f7b7-bucket/data/raw/scraped_low_rated_letsee.csv' data/raw/
          gsutil cp 'gs://us-central1-echo-ai-9c58f7b7-bucket/data/raw/scraped_reviewsnew.csv' data/raw/
          gsutil cp 'gs://us-central1-echo-ai-9c58f7b7-bucket/data/raw/scraped_mediocre.csv' data/raw/
          gsutil cp 'gs://us-central1-echo-ai-9c58f7b7-bucket/data/raw/scraped_mediocre_second.csv' data/raw/

          python -c "
          import pandas as pd
          from pathlib import Path

          csv_files = list(Path('data/raw').glob('*.csv'))
          csv_files = [f for f in csv_files if 'apify_unprocessed' not in f.name]

          print(f'Found {len(csv_files)} CSV files')

          dfs = []
          for file in csv_files:
              df = pd.read_csv(file)
              print(f'{file.name}: {len(df)} rows')
              dfs.append(df)

          df_merged = pd.concat(dfs, ignore_index=True)
          print(f'Total merged: {len(df_merged)} reviews')

          df_merged = df_merged.drop_duplicates(subset=['reviewText'], keep='first')
          print(f'After dedup: {len(df_merged)} reviews')

          print('Rating distribution:')
          print(df_merged['reviewRating'].value_counts().sort_index())

          df_merged.to_csv('data/raw/apify_unprocessed.csv', index=False)
          "

          ls -lh data/raw/apify_unprocessed.csv

      - name: Run preprocessing
        run: |
          cd Data-Pipeline/scripts
          python preprocessing.py

      - name: Run feature engineering
        run: |
          cd Data-Pipeline/scripts
          python feature_engineering.py

      - name: Run data validation
        id: validate
        run: |
          cd Data-Pipeline/scripts
          python validation.py

          if [ -f "data/metrics/validation_results.json" ]; then
            PASSED=$(python -c "import json; data=json.load(open('data/metrics/validation_results.json')); print(data.get('validation_passed', False))")
            echo "passed=$PASSED" >> $GITHUB_OUTPUT

            if [ "$PASSED" = "False" ]; then
              exit 1
            fi
          fi

      - name: Upload processed data
        uses: actions/upload-artifact@v4
        with:
          name: processed-data
          path: data/

  model-training:
    name: Train ML Model
    runs-on: ubuntu-latest
    needs: data-preprocessing
    if: needs.data-preprocessing.outputs.preprocessing-passed == 'true'
    outputs:
      model-trained: ${{ steps.training.outputs.success }}
      best-model: ${{ steps.training.outputs.model_name }}
      f1-score: ${{ steps.training.outputs.f1_score }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install --no-cache-dir -r requirements.txt

      - name: Download processed data
        uses: actions/download-artifact@v4
        with:
          name: processed-data
          path: data/

      - name: Disable MLflow tracking
        run: |
          echo "export MLFLOW_TRACKING_URI=''" >> $GITHUB_ENV

      - name: Train models
        id: training
        run: |
          cd Model-Pipeline
          python run_ml_pipeline.py --quick

          if [ -f "results/training_results.json" ]; then
            BEST_MODEL=$(python -c "import json; data=json.load(open('results/training_results.json')); print(data.get('best_model', 'Unknown'))")
            BEST_SCORE=$(python -c "import json; data=json.load(open('results/training_results.json')); print(data.get('best_f1_score', 0))")

            echo "success=true" >> $GITHUB_OUTPUT
            echo "model_name=$BEST_MODEL" >> $GITHUB_OUTPUT
            echo "f1_score=$BEST_SCORE" >> $GITHUB_OUTPUT

            echo "[OK] Training: $BEST_MODEL F1=$BEST_SCORE"
          else
            echo "success=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trained-models
          path: |
            Model-Pipeline/models/
            Model-Pipeline/results/

  model-validation:
    name: Validate Model Performance
    runs-on: ubuntu-latest
    needs: model-training
    if: needs.model-training.outputs.model-trained == 'true'
    outputs:
      validation-passed: ${{ steps.validate.outputs.passed }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: trained-models
          path: Model-Pipeline/

      - name: Download data
        uses: actions/download-artifact@v4
        with:
          name: processed-data
          path: data/

      - name: Validate model
        id: validate
        timeout-minutes: 15
        run: |
          cd Model-Pipeline
          timeout 600 python model_validation.py || echo "[WARNING] Validation timeout"

          F1_SCORE=${{ needs.model-training.outputs.f1-score }}
          echo "[INFO] Model F1 Score: $F1_SCORE"

          PASS=$(python -c "print($F1_SCORE >= $MIN_F1_SCORE)")
          if [ "$PASS" = "True" ]; then
            echo "passed=true" >> $GITHUB_OUTPUT
            echo "[OK] Validation passed: F1=$F1_SCORE (min: $MIN_F1_SCORE)"
          else
            echo "passed=false" >> $GITHUB_OUTPUT
            echo "[ERROR] F1=$F1_SCORE below threshold $MIN_F1_SCORE"
            exit 1
          fi

  # ── UPDATED JOB ─────────────────────────────────────────────────────────────
  inference-and-response-generation:
    name: Run Enhanced Inference Pipeline
    runs-on: ubuntu-latest
    needs: model-validation
    if: needs.model-validation.outputs.validation-passed == 'true'
    outputs:
      inference-completed: ${{ steps.inference.outputs.completed }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install --no-cache-dir -r requirements.txt
          # spaCy model required by bert_absa.py clause splitter
          python -m spacy download en_core_web_sm

      - name: Download trained models
        uses: actions/download-artifact@v4
        with:
          name: trained-models
          path: Model-Pipeline/

      - name: Download processed data
        uses: actions/download-artifact@v4
        with:
          name: processed-data
          path: data/

      - name: Run enhanced inference pipeline
        id: inference
        timeout-minutes: 30
        run: |
          cd Model-Pipeline

          FEATURES_FILE=$(find ../data -name "*features*.csv" -o -name "*processed*.csv" | head -1)

          if [ -z "$FEATURES_FILE" ]; then
            echo "[ERROR] No features file found"
            ls -la ../data/processed/ || echo "No processed directory"
            exit 1
          fi

          echo "[INFO] Using features file: $FEATURES_FILE"

          python -c "
          import sys
          import pandas as pd
          from pathlib import Path

          sys.path.insert(0, '.')

          from enhanced_inference_pipeline import EnhancedInferencePipeline

          features_file = '$FEATURES_FILE'
          print(f'[INFO] Loading test data from {features_file}...')

          try:
              df = pd.read_csv(features_file).head(100)
              print(f'[INFO] Loaded {len(df)} reviews')
          except Exception as e:
              print(f'[ERROR] Failed to load data: {e}')
              sys.exit(1)

          print('[INFO] Initializing EnhancedInferencePipeline...')
          pipeline = EnhancedInferencePipeline(
              use_bert=True,
              use_enhanced_absa=True
          )
          # Skip LLM in CI — template responses only
          pipeline.load_models(load_llm=False)

          print('[INFO] Running inference on 100 reviews...')
          results = []
          for _, row in df.iterrows():
              result = pipeline.process_review(row.to_dict(), generate_response=True)
              results.append(result)

          # Build output dataframe
          rows = []
          for r in results:
              if r['status'] != 'success':
                  continue
              sa = r['sentiment_analysis']
              absa = r.get('aspect_analysis', {})
              aspects = absa.get('aspect_sentiments', {})
              row_out = {
                  'reviewText': r['input'],
                  'sentiment': sa['sentiment'],
                  'confidence': sa.get('confidence', 0),
                  'sarcasm_corrected': r.get('sarcasm_analysis', {}).get('was_corrected', False),
                  'critical_issue': r.get('critical_issues', {}).get('has_critical_issue', False),
                  'has_mixed_sentiment': absa.get('has_mixed_sentiment', False),
                  'food': aspects.get('food', {}).get('sentiment', 'not_mentioned'),
                  'service': aspects.get('service', {}).get('sentiment', 'not_mentioned'),
                  'ambiance': aspects.get('ambiance', {}).get('sentiment', 'not_mentioned'),
                  'price': aspects.get('price', {}).get('sentiment', 'not_mentioned'),
                  'cleanliness': aspects.get('cleanliness', {}).get('sentiment', 'not_mentioned'),
                  'generated_response': r.get('generated_response', '')
              }
              rows.append(row_out)

          df_out = pd.DataFrame(rows)

          output_file = Path('results/inference_results.csv')
          output_file.parent.mkdir(exist_ok=True)
          df_out.to_csv(output_file, index=False)

          print(f'[OK] Inference completed: {len(df_out)} reviews processed')

          # Sentiment distribution
          print('[INFO] Sentiment distribution:')
          for sentiment, count in df_out['sentiment'].value_counts().items():
              print(f'  {sentiment}: {count}')

          # Pipeline signal summary
          sarcasm_count = df_out['sarcasm_corrected'].sum()
          critical_count = df_out['critical_issue'].sum()
          mixed_count = df_out['has_mixed_sentiment'].sum()
          print(f'[INFO] Sarcasm corrections: {sarcasm_count}')
          print(f'[INFO] Critical issues flagged: {critical_count}')
          print(f'[INFO] Mixed sentiment reviews: {mixed_count}')

          responses_generated = df_out['generated_response'].str.len().gt(0).sum()
          print(f'[OK] Responses generated: {responses_generated}/{len(df_out)}')
          "

          if [ $? -eq 0 ]; then
            echo "completed=true" >> $GITHUB_OUTPUT
          else
            echo "completed=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Upload inference results
        uses: actions/upload-artifact@v4
        with:
          name: inference-results
          path: Model-Pipeline/results/inference_results.csv
  # ── END UPDATED JOB ──────────────────────────────────────────────────────────

  llm-response-testing:
    name: LLM Response Quality Testing
    runs-on: ubuntu-latest
    needs: inference-and-response-generation
    if: |
      needs.inference-and-response-generation.outputs.inference-completed == 'true' &&
      github.event.inputs.test_llm == 'true'
    outputs:
      llm-tested: ${{ steps.llm_test.outputs.tested }}
      avg-quality-score: ${{ steps.llm_test.outputs.quality_score }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies including transformers
        run: |
          pip install --no-cache-dir -r requirements.txt
          pip install transformers==4.36.0 torch==2.1.0 accelerate==0.25.0
          pip install sentencepiece protobuf
          python -m spacy download en_core_web_sm

      - name: Download trained models
        uses: actions/download-artifact@v4
        with:
          name: trained-models
          path: Model-Pipeline/

      - name: Download processed data
        uses: actions/download-artifact@v4
        with:
          name: processed-data
          path: data/

      - name: Download template inference results
        uses: actions/download-artifact@v4
        with:
          name: inference-results
          path: Model-Pipeline/results/template_results/

      - name: Test LLM response generation
        id: llm_test
        timeout-minutes: 30
        run: |
          cd Model-Pipeline

          FEATURES_FILE=$(find ../data -name "*features*.csv" -o -name "*processed*.csv" | head -1)

          python -c "
          import sys, time, json
          import pandas as pd
          from pathlib import Path

          sys.path.insert(0, '.')
          from enhanced_inference_pipeline import EnhancedInferencePipeline

          print('[INFO] Starting LLM Response Testing...')

          df = pd.read_csv('$FEATURES_FILE').head(20)
          print(f'[INFO] Testing on {len(df)} reviews')

          print('[INFO] Initializing pipeline with LLM...')
          start = time.time()

          try:
              pipeline = EnhancedInferencePipeline(use_bert=True, use_enhanced_absa=True)
              pipeline.load_models(load_llm=True)
              print(f'[OK] Pipeline loaded in {time.time() - start:.1f}s')

              gen_start = time.time()
              results = [
                  pipeline.process_review(row.to_dict(), generate_response=True)
                  for _, row in df.iterrows()
              ]
              print(f'[OK] Generated {len(results)} responses in {time.time() - gen_start:.1f}s')

              llm_responses = [
                  r.get('generated_response', '') for r in results if r['status'] == 'success'
              ]

              template_file = Path('results/template_results/inference_results.csv')
              template_responses = pd.read_csv(template_file)['generated_response'].head(20).tolist()

              avg_llm_len = sum(len(r) for r in llm_responses) / max(len(llm_responses), 1)
              avg_tmpl_len = sum(len(r) for r in template_responses) / max(len(template_responses), 1)
              gen_time = (time.time() - gen_start) / max(len(results), 1)

              quality_score = 0
              if avg_llm_len > 50: quality_score += 2
              if avg_llm_len > 100: quality_score += 2
              if gen_time < 5: quality_score += 3
              if len(set(llm_responses)) > len(set(template_responses)): quality_score += 3

              report = {
                  'samples_tested': len(results),
                  'avg_llm_length': avg_llm_len,
                  'avg_template_length': avg_tmpl_len,
                  'gen_time_per_review': gen_time,
                  'quality_score': quality_score
              }

              Path('results').mkdir(exist_ok=True)
              with open('results/llm_comparison_report.json', 'w') as f:
                  json.dump(report, f, indent=2)

              print(f'[OK] Quality score: {quality_score}/10')

              with open('/tmp/llm_outputs.txt', 'w') as f:
                  f.write(f'tested=true\nquality_score={quality_score}\n')

          except Exception as e:
              print(f'[ERROR] LLM testing failed: {e}')
              import traceback; traceback.print_exc()
              with open('/tmp/llm_outputs.txt', 'w') as f:
                  f.write('tested=false\nquality_score=0\n')
          "

          if [ -f /tmp/llm_outputs.txt ]; then
            while IFS='=' read -r key value; do
              echo "$key=$value" >> $GITHUB_OUTPUT
            done < /tmp/llm_outputs.txt
          else
            echo "tested=false" >> $GITHUB_OUTPUT
            echo "quality_score=0" >> $GITHUB_OUTPUT
          fi

      - name: Upload LLM results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm-results
          path: |
            Model-Pipeline/results/llm_inference_results.csv
            Model-Pipeline/results/llm_comparison_report.json

  bias-detection:
    name: Bias and Fairness Check
    runs-on: ubuntu-latest
    needs: model-validation
    if: needs.model-validation.outputs.validation-passed == 'true'
    outputs:
      bias-passed: ${{ steps.bias.outputs.passed }}
      violations: ${{ steps.bias.outputs.violations }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: trained-models
          path: Model-Pipeline/

      - name: Download data
        uses: actions/download-artifact@v4
        with:
          name: processed-data
          path: data/

      - name: Run bias detection
        id: bias
        timeout-minutes: 10
        run: |
          cd Model-Pipeline
          timeout 300 python bias_detection.py || echo "[WARNING] Timeout"

          if [ -f "results/bias_report.json" ]; then
            VIOLATIONS=$(python -c "import json; data=json.load(open('results/bias_report.json')); print(len(data.get('violations', [])))")
            echo "violations=$VIOLATIONS" >> $GITHUB_OUTPUT

            if [ $VIOLATIONS -le $MAX_BIAS_VIOLATIONS ]; then
              echo "passed=true" >> $GITHUB_OUTPUT
              echo "[OK] Bias check passed: $VIOLATIONS violations"
            else
              echo "passed=true" >> $GITHUB_OUTPUT
              echo "[WARNING] $VIOLATIONS violations (continuing anyway)"
            fi
          else
            echo "passed=true" >> $GITHUB_OUTPUT
            echo "[WARNING] No bias report generated"
          fi

  push-to-gcr:
    name: Push Model to GCR
    runs-on: ubuntu-latest
    needs: [model-training, model-validation, bias-detection, inference-and-response-generation]
    if: |
      needs.model-validation.outputs.validation-passed == 'true' &&
      github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCR
        run: |
          gcloud auth configure-docker ${{ env.GCR_REGION }}-docker.pkg.dev

      - name: Download trained models
        uses: actions/download-artifact@v4
        with:
          name: trained-models
          path: Model-Pipeline/

      - name: Download inference results
        uses: actions/download-artifact@v4
        with:
          name: inference-results
          path: Model-Pipeline/results/

      - name: Download LLM results (if available)
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: llm-results
          path: Model-Pipeline/results/llm/

      - name: Create model package
        run: |
          cd Model-Pipeline/models
          mkdir -p model-package
          cp best_model.pkl model-package/
          cp tfidf_vectorizer.pkl model-package/

          cat > model-package/model_metadata.json << EOF
          {
            "model_name": "${{ needs.model-training.outputs.best-model }}",
            "f1_score": ${{ needs.model-training.outputs.f1-score }},
            "trained_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "git_commit": "${{ github.sha }}",
            "git_branch": "${{ github.ref_name }}",
            "inference_pipeline": "EnhancedInferencePipeline",
            "pipeline_modules": "BERT + HybridABSA + SarcasmDetector + CriticalIssueDetector",
            "inference_completed": "${{ needs.inference-and-response-generation.outputs.inference-completed }}",
            "bias_violations": ${{ needs.bias-detection.outputs.violations }}
          }
          EOF

          tar -czf echoai-model-${{ github.sha }}.tar.gz model-package/
          echo "[OK] Model packaged"

      - name: Upload to GCS
        run: |
          VERSION=$(date +%Y%m%d-%H%M%S)
          BUCKET="gs://${{ env.PROJECT_ID }}-models"

          gsutil mb -l ${{ env.GCR_REGION }} $BUCKET || echo "Bucket exists"

          gsutil cp Model-Pipeline/models/echoai-model-${{ github.sha }}.tar.gz \
            $BUCKET/echoai-sentiment-model/$VERSION/model.tar.gz

          gsutil cp Model-Pipeline/models/model-package/model_metadata.json \
            $BUCKET/echoai-sentiment-model/$VERSION/metadata.json

          gsutil cp Model-Pipeline/results/inference_results.csv \
            $BUCKET/echoai-sentiment-model/$VERSION/inference_results.csv

          if [ -f "Model-Pipeline/results/llm/llm_inference_results.csv" ]; then
            gsutil cp Model-Pipeline/results/llm/llm_inference_results.csv \
              $BUCKET/echoai-sentiment-model/$VERSION/llm_inference_results.csv
            gsutil cp Model-Pipeline/results/llm/llm_comparison_report.json \
              $BUCKET/echoai-sentiment-model/$VERSION/llm_comparison_report.json
          fi

          echo "$VERSION" | gsutil cp - $BUCKET/echoai-sentiment-model/latest.txt
          echo "[OK] Model uploaded: $BUCKET/echoai-sentiment-model/$VERSION/"
          echo "MODEL_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Create model registry entry
        run: |
          echo "Model Registry Entry:"
          echo "  Pipeline: EnhancedInferencePipeline"
          echo "  Modules: BERT + HybridABSA + SarcasmDetector + CriticalIssueDetector"
          echo "  F1 Score: ${{ needs.model-training.outputs.f1-score }}"
          echo "  Bias Violations: ${{ needs.bias-detection.outputs.violations }}"
          echo "  Version: ${{ env.MODEL_VERSION }}"
          echo "  Commit: ${{ github.sha }}"

  notify:
    name: Send Notifications
    runs-on: ubuntu-latest
    needs: [data-preprocessing, model-training, model-validation, inference-and-response-generation, llm-response-testing, bias-detection, push-to-gcr]
    if: always()

    steps:
      - name: Create summary
        run: |
          echo "## EchoAI ML Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Model Performance" >> $GITHUB_STEP_SUMMARY
          echo "- Best Model: ${{ needs.model-training.outputs.best-model }}" >> $GITHUB_STEP_SUMMARY
          echo "- F1 Score: ${{ needs.model-training.outputs.f1-score }}" >> $GITHUB_STEP_SUMMARY
          echo "- Bias Violations: ${{ needs.bias-detection.outputs.violations }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Enhanced Inference Pipeline" >> $GITHUB_STEP_SUMMARY
          echo "- Pipeline: EnhancedInferencePipeline (BERT + ABSA + Sarcasm + Critical Issues)" >> $GITHUB_STEP_SUMMARY
          echo "- Inference Completed: ${{ needs.inference-and-response-generation.outputs.inference-completed }}" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.llm-response-testing.outputs.llm-tested }}" = "true" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### LLM Response Testing" >> $GITHUB_STEP_SUMMARY
            echo "- Model: Flan-T5-Base" >> $GITHUB_STEP_SUMMARY
            echo "- Quality Score: ${{ needs.llm-response-testing.outputs.avg-quality-score }}/10" >> $GITHUB_STEP_SUMMARY
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### LLM Response Testing" >> $GITHUB_STEP_SUMMARY
            echo "- Status: Skipped (enable with workflow_dispatch)" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Pipeline Status" >> $GITHUB_STEP_SUMMARY
          echo "- Data Preprocessing: ${{ needs.data-preprocessing.result }}" >> $GITHUB_STEP_SUMMARY
